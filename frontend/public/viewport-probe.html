<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewport probe</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1017; color: #e8ecf4;
         font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid #2a3342; }
  h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  p  { margin: 0; color: #a8b2c6; font-size: 13px; }
  .pad { padding: 14px 16px; }
  input { width: 100%; padding: 14px; font: inherit; font-size: 16px;
          background: #161b25; color: #e8ecf4; border: 1px solid #2a3342; border-radius: 8px; }
  button { margin-top: 10px; padding: 12px 16px; font: inherit; border-radius: 8px;
           background: #1f5f8b; color: #fff; border: 0; }
  .live { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px;
          padding: 12px 16px; border-block: 1px solid #2a3342; }
  .live span:nth-child(odd) { color: #78849c; }
  .live b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #log { padding: 12px 16px 40px; white-space: pre; overflow-x: auto; font-size: 12.5px; color: #a8b2c6; }
  .warn { color: #d8a54a; }
</style>
</head>
<body>
<header>
  <h1>Viewport probe</h1>
  <p>Tap the box, type a character, then close the keyboard. Then Copy and send me the log.</p>
</header>

<div class="pad">
  <input id="field" placeholder="tap here to raise the keyboard" autocomplete="off">
  <button id="copy">Copy the log</button>
  <button id="clear">Clear</button>
</div>

<div class="live" id="live"></div>
<div id="log"></div>

<script>
(function () {
  var vv = window.visualViewport;
  var live = document.getElementById('live');
  var logEl = document.getElementById('log');
  var lines = [];
  var t0 = Date.now();

  function read() {
    var d = document.documentElement;
    return {
      t: Date.now() - t0,
      'doc.clientHeight': d.clientHeight,
      'window.innerHeight': window.innerHeight,
      'vv.height': vv ? Math.round(vv.height * 100) / 100 : null,
      'vv.offsetTop': vv ? Math.round(vv.offsetTop * 100) / 100 : null,
      'vv.pageTop': vv ? Math.round(vv.pageTop * 100) / 100 : null,
      'vv.scale': vv ? Math.round(vv.scale * 1000) / 1000 : null,
      'window.scrollY': Math.round(window.scrollY * 100) / 100,
      'body.scrollTop': Math.round(document.body.scrollTop * 100) / 100,
      'doc.scrollTop': Math.round(d.scrollTop * 100) / 100
    };
  }

  function paint(s) {
    var html = '';
    for (var k in s) if (k !== 't') html += '<span>' + k + '</span><span><b>' + s[k] + '</b></span>';
    live.innerHTML = html;
  }

  function snap(why) {
    var s = read();
    paint(s);
    var parts = [];
    for (var k in s) if (k !== 't') parts.push(k.replace(/^\w+\./, '') + '=' + s[k]);
    lines.unshift(String(s.t).padStart(6) + 'ms ' + why.padEnd(14) + ' ' + parts.join(' '));
    if (lines.length > 120) lines.pop();
    logEl.textContent = lines.join('\n');
  }

  // Every event that could plausibly matter, named so the order is visible.
  ['resize', 'orientationchange', 'scroll', 'focusin', 'focusout'].forEach(function (n) {
    window.addEventListener(n, function () { snap('win:' + n); }, true);
  });
  if (vv) ['resize', 'scroll'].forEach(function (n) {
    vv.addEventListener(n, function () { snap('vv:' + n); });
  });

  // The keyboard animates, so also sample after it should have settled.
  document.getElementById('field').addEventListener('focus', function () {
    [100, 300, 600, 1000].forEach(function (ms) { setTimeout(function () { snap('after+' + ms); }, ms); });
  });
  document.getElementById('field').addEventListener('blur', function () {
    [100, 300, 600, 1000].forEach(function (ms) { setTimeout(function () { snap('closed+' + ms); }, ms); });
  });

  document.getElementById('copy').addEventListener('click', function () {
    var text = navigator.userAgent + '\n\n' + lines.slice().reverse().join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    else { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
           t.select(); document.execCommand('copy'); t.remove(); }
    this.textContent = 'Copied';
    var self = this; setTimeout(function () { self.textContent = 'Copy the log'; }, 1500);
  });
  document.getElementById('clear').addEventListener('click', function () {
    lines = []; logEl.textContent = ''; t0 = Date.now(); snap('cleared');
  });

  if (!vv) logEl.innerHTML = '<span class="warn">No visualViewport on this browser.</span>\n';
  snap('load');
})();
</script>
</body>
</html>
